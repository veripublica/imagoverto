[package]
name = "imagoverto"
version = "0.0.0"
edition = "2024"
# The floor of the imazen codecs (zenwebp, zenjxl, zenravif, zenavif-parse).
rust-version = "1.93"
description = "Converts still images between WebP, AVIF, JPEG XL, JPEG and PNG, in pure Rust."
license = "AGPL-3.0-only"
repository = "https://github.com/veripublica/imagoverto"
homepage = "https://github.com/veripublica/imagoverto"
readme = "README.md"
keywords = ["image", "webp", "avif", "jpeg-xl", "converter"]
categories = ["multimedia::images", "command-line-utilities"]
# Nothing is released until it is stable (Baris, 2026-10-29).
publish = false

[features]
default = ["cli"]
# The command-line tool and its JSON report. A library user (epublift, a wasm
# build) turns default features off and gets neither serde nor the binary.
cli = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "imagoverto"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
# JPEG and PNG. No default features: no rayon, and none of the other formats,
# so the decoders imagoverto exposes are exactly the ones it chose.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# WebP encode and decode.
zenwebp = "0.4.6"
# JPEG XL encode and decode.
zenjxl = { version = "0.2.1", default-features = false, features = ["encode", "decode"] }
# zenjxl's encoder, named directly only for `jpeg-reencoding`: JPEG -> JPEG XL
# that a decoder can turn back into the original JPEG, byte for byte. zenjxl
# does not expose it. Same version zenjxl resolves.
jxl-encoder = { version = "0.3.4", default-features = false, features = ["jpeg-reencoding"] }
# AVIF encode. Called directly rather than through zenavif: zenavif always
# depends on rav1d-safe, and its newest release (0.1.6) pins the 0.5 line,
# whose decoder hangs and mis-decodes (imazen/zenavif#78). No default
# features: `asm` needs nasm, and the family builds with no C toolchain.
#
# Temporarily from git, pinned (Baris, 2026-10-30): zenravif 0.1.3 on crates.io
# writes visibly corrupt lossy AVIF on some real images (9/120 shelf images),
# its lossless mode is lossy, and its premultiplied alpha is broken; main
# (0.2.0 on zenrav1e 0.2.0) fixes all three (0/120). Move to the crates.io
# 0.2.0 as soon as it is published. Update the rev only deliberately, then
# re-run the dav1d/libavif tests and the shelf measurement. `imazen` is the
# feature that carries `with_lossless` (pure Rust, no C).
zenravif = { git = "https://github.com/imazen/cavif-rs", rev = "52bb0243a418989393c884ab0d1226c356cb2272", default-features = false, features = ["imazen", "stop"] }
# AVIF decode: the container with zenavif-parse, the AV1 data with rav1d-safe.
# 0.6.0 is the first rav1d-safe that matches dav1d byte for byte (epublift,
# 0/480 frames differ, 0/9 hangs, 2026-10-29). Baris's decision, 2026-10-29.
zenavif-parse = "0.6.2"
rav1d-safe = "0.6.0"
# Cancellation: the trait the codecs check (`Cancel` implements it) and the
# token zenravif takes it as.
enough = "0.4.5"
almost-enough = { version = "0.4.5", default-features = false, features = ["alloc"] }
# The pixel-buffer types zenravif's encoder takes.
imgref = "1.12.0"
rgb = "0.8.52"
# ICC profiles for AVIF images described by CICP (Display P3, BT.2020);
# `image` already depends on it.
moxcms = "0.8.1"
# The pixel buffers zenjxl's decoder returns.
zenpixels = "0.2.16"

[dev-dependencies]
# The calibration tool (examples/calibrate.rs) only; never shipped.
butteraugli = "0.9.3"

# zenravif main asks for zenavif-serialize 0.2.0, which is on git only. A
# [patch] applies only at the top of a build: a crate that depends on
# imagoverto needs this same entry until zenravif 0.2.0 is on crates.io.
[patch.crates-io]
zenavif-serialize = { git = "https://github.com/imazen/zenavif", rev = "94116d266299f347cfd10a75d440a5bc3b598d2c" }
